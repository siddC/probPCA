name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly, catches breakage from new dependency releases
  workflow_dispatch:
  workflow_call:            # the release workflow runs the full suite before publishing

permissions:
  contents: read

concurrency:                # a new push to a pull request cancels its older runs
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned so a new ruff release cannot fail unrelated pull requests; bump it on purpose
      # (and in .pre-commit-config.yaml).
      - run: pip install "ruff==0.15.11"
      - run: ruff check --output-format=github .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . "mypy==2.4.1"
      - run: mypy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest and windows-latest join after v0.2, Python 3.15 after v0.3 (ROADMAP.md).
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - run: pytest -q -m "not slow" --cov --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.13'
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Recovery over 10 seeds and reproduction of published results (layers 3 and 4).
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - run: pytest -q -m slow

  # Smoke test of the built wheel, not the source tree: every module imports, so a file left
  # out of the wheel fails here. twine checks that the metadata renders on PyPI.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: pip install dist/*.whl
      - run: cp .github/smoke_test.py "$RUNNER_TEMP" && cd "$RUNNER_TEMP" && python smoke_test.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html

  # The one check to require in the branch ruleset. It passes only if every job above
  # succeeded, so the ruleset does not change when the matrix does. `if: always()` makes
  # it run (and fail) when a job it depends on fails or is cancelled; without it the job
  # would be skipped, and GitHub treats a skipped required check as passing.
  ci-passed:
    if: always()
    needs: [lint, typecheck, test, slow, wheel, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then exit 1; fi
          done
